spring.application.name=financial-plan

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# Overridable through environment variables; the defaults below are for local development only.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/financial_plan}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
# Schema is versioned by Flyway (src/main/resources/db/migration); Hibernate only checks the mappings against it.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
# Databases that already have tables but no Flyway history (created by the old ddl-auto=update) are marked as V1.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Auth0 tenant that issues the access tokens (trailing slash is part of Auth0's issuer) and the API identifier
# the tokens must be issued for. The signing keys are discovered from the issuer's JWKS.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${AUTH0_ISSUER_URI:https://financial-plan.us.auth0.com/}
spring.security.oauth2.resourceserver.jwt.audiences=${AUTH0_AUDIENCE:https://financial-plan-api}

app.frontend-url=${APP_FRONTEND_URL:http://localhost:3000}
# Comma-separated list of browser origins allowed to call the API directly (the Nuxt proxy calls it server-side).
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:${app.frontend-url}}

# Recurring bills: months of future bills kept materialized, hard ceiling for far-future filters,
# and the daily top-up job schedule.
bills.recurring.horizon-months=12
bills.recurring.max-horizon-months=60
bills.recurring.generation-cron=0 0 3 * * *

# Recurring credit card subscriptions: months of future transactions kept materialized, hard ceiling
# for far-future filters, and the daily top-up job schedule (offset from the bills job).
credit-cards.recurring.horizon-months=12
credit-cards.recurring.max-horizon-months=60
credit-cards.recurring.generation-cron=0 30 3 * * *

spring.mail.host=sandbox.smtp.mailtrap.io
spring.mail.port=2525
spring.mail.username=${MAILTRAP_USERNAME:}
spring.mail.password=${MAILTRAP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Per-user request limits, keyed by the JWT subject (the backend only sees the Nitro proxy's IP).
# Format: <requests>/<period>[,<requests>/<period>...], period in s, m, h or d. The first matching rule wins;
# every other authenticated request counts against default-limits. Over the limit the API answers 429 + Retry-After.
app.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
app.rate-limit.default-limits=${RATE_LIMIT_DEFAULT:300/1m}
# Reveals whether an e-mail has an account
app.rate-limit.rules[0].method=GET
app.rate-limit.rules[0].path=/spaces/*/members/search
app.rate-limit.rules[0].limits=${RATE_LIMIT_MEMBER_SEARCH:10/1m,50/1d}
# Sends e-mails to arbitrary addresses
app.rate-limit.rules[1].method=POST
app.rate-limit.rules[1].path=/spaces/*/invites
app.rate-limit.rules[1].limits=${RATE_LIMIT_INVITES:10/1h,30/1d}
# Each Space creates roles, permissions and system categories
app.rate-limit.rules[2].method=POST
app.rate-limit.rules[2].path=/spaces
app.rate-limit.rules[2].limits=${RATE_LIMIT_SPACE_CREATION:10/1d}
# Calls Auth0 /userinfo
app.rate-limit.rules[3].method=POST
app.rate-limit.rules[3].path=/users
app.rate-limit.rules[3].limits=${RATE_LIMIT_USER_CREATION:5/1h}
# Aggregations over the whole Space
app.rate-limit.rules[4].method=POST
app.rate-limit.rules[4].path=/reports/**
app.rate-limit.rules[4].limits=${RATE_LIMIT_REPORTS:30/1m}
