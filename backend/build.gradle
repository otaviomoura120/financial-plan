plugins {
	id 'java'
	id("groovy")
	id 'org.springframework.boot' version '4.0.9'
	id 'io.spring.dependency-management' version '1.1.7'
}


group = 'com.devhouse'
version = '0.0.1-SNAPSHOT'

repositories {
	mavenCentral()
}

dependencies {
//	implementation 'org.springframework.boot:spring-boot-starter-data-jdbc'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	runtimeOnly 'com.mysql:mysql-connector-j'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.flywaydb:flyway-mysql'
//	testImplementation 'org.springframework.boot:spring-boot-starter-data-jdbc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	implementation("jakarta.annotation:jakarta.annotation-api")
	implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'
	implementation 'org.springframework.boot:spring-boot-starter-mail'
	// Per-user rate limiting (infrastructure/ratelimit); Caffeine evicts idle buckets
	implementation 'com.bucket4j:bucket4j_jdk17-core:8.21.0'
	implementation 'com.github.ben-manes.caffeine:caffeine'

	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation("com.tngtech.archunit:archunit-junit5:1.4.2")

	// Spock core and Spring integration (Groovy is only needed to compile and run the specs)
	testImplementation 'org.apache.groovy:groovy:4.0.28'
	testImplementation 'org.spockframework:spock-core:2.3-groovy-4.0'
	testImplementation 'org.spockframework:spock-spring:2.3-groovy-4.0'

	testImplementation platform("org.apache.groovy:groovy-bom:4.0.28")

	// Standard Spring Boot test starter
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.named('test') {
	useJUnitPlatform()
}
